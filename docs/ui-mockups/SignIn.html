<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
        }

        h2 {
            text-align: center;
            margin-bottom: 0px;
            padding: 3px;
        }
        h3 {
            text-align: center;
            margin-bottom: 30px;
            padding: 0px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 50%;
            padding: 10px;
            margin-top: 15px;
            align-items: center;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>SKEG</h2>
        <h3>Rower Sign In<h3>

        <form>
            <input 
                type="text" 
                placeholder="Email" 
                required
            >

            <input 
                type="password" 
                placeholder="Password" 
                required
            >
            <a href="FuzzySearch.html" class="button">Rower Sign In</a\>
            <a>
        </form>
        <a href="repairs.html" class="button">Coach Sign In</a>
        <a>
    </div>

</body>
</html>
