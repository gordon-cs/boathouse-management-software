<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boat Checked In</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            color: #102a43;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border-top: 8px solid #0b69a3;
        }
        .success-banner {
            text-align: center;
            margin-bottom: 2rem;
        }
        .success-banner h1 {
            color: #0b69a3;
            margin: 0 0 0.5rem 0;
            font-size: 1.75rem;
        }
        .boat-name {
            background-color: #e6f2fa;
            color: #0b69a3;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            display: inline-block;
            font-size: 1.1rem;
        }
        .stats-group {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid #edf2f7;
        }
        .stat-row:last-child {
            border-bottom: none;
        }
        .stat-label {
            color: #627d98;
            font-weight: 500;
        }
        .stat-value {
            font-weight: 600;
        }
        .duration {
            color: #0b69a3;
            font-size: 1.2rem;
        }
        .report-section {
            margin-bottom: 2rem;
        }
        .report-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #334e68;
        }
        .report-section p {
            font-size: 0.9rem;
            color: #627d98;
            margin: 0 0 0.75rem 0;
            line-height: 1.4;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 0.75rem;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #0b69a3;
            box-shadow: 0 0 0 3px rgba(11, 105, 163, 0.1);
        }
        .btn-complete {
            background-color: #0b69a3;
            color: white;
            border: none;
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-complete:hover {
            background-color: #095582;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Success Title & Boat Name -->
        <div class="success-banner">
            <h1>Boat Checked In</h1>
            <span class="boat-name">⛵ Racing Shell: Interceptor</span>
        </div>

        <!-- Session Statistics -->
        <div class="stats-group">
            <div class="stat-row">
                <span class="stat-label">Time Checked Out:</span>
                <span class="stat-value">04:15 PM</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Time Checked In:</span>
                <span class="stat-value">05:45 PM</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Total Duration:</span>
                <span class="stat-value duration">1h 30m</span>
            </div>
        </div>

        <!-- Coach Hopkins Repair Report Box -->
        <div class="report-section">
            <label for="issues">Repairs &amp; Maintenance</label>
            <p>Please report any repairs, adjustments, or issues to <strong>Coach Hopkins</strong> below.</p>
            <textarea id="issues" placeholder="Describe any mechanical failures or issues here (leave blank if none)..."></textarea>
        </div>

        <!-- Complete Session Button -->
        <button class="btn-complete" onclick="window.location.href='FuzzySearch.html'">Complete Session</button>
    </div>

</body>
</html>
